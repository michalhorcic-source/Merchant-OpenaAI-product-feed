name: Publish buyable Boschino CZ OpenAI Ads feed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-boschino-cz-buyable-ads-feed.yml'
      - 'scripts/build_boschino_cz_feed_from_merchant_export.py'
      - 'tests/test_boschino_cz_feed_from_merchant_export.py'
      - 'openai/boschino-cz-buyable-ads.csv'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate builders
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
      - name: Validate committed public feed
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from pathlib import Path
          from decimal import Decimal
          p=Path('openai/boschino-cz-buyable-ads.csv')
          with p.open(encoding='utf-8', newline='') as f:
              reader=csv.DictReader(f)
              rows=list(reader)
          required={'id','title','description','link','image_link','availability','price','brand'}
          labels={f'custom_label_{i}' for i in range(5)}
          if not (required | labels) <= set(reader.fieldnames or []): raise SystemExit('Feed header is missing required fields')
          if not rows: raise SystemExit('Feed is empty')
          for line,row in enumerate(rows,2):
              if any(not row[field].strip() for field in required): raise SystemExit(f'Blank required field on CSV line {line}')
              if row['availability'] not in {'in_stock','backorder'}: raise SystemExit(f'Unexpected availability on CSV line {line}')
              if not row['price'].endswith(' CZK') or Decimal(row['price'].split()[0])<=0: raise SystemExit(f'Invalid price on CSV line {line}')
              if row['identifier_exists']!='no' and not (row['gtin'] or row['mpn']): raise SystemExit(f'Missing identifier on CSV line {line}')
          print(f'Validated {len(rows)} offers; availability limited to in_stock/backorder; all five label columns present')
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as summary:
              from collections import Counter
              counts=Counter(row['availability'] for row in rows)
              summary.write(f'Validated **{len(rows)}** offers. Availability: `{dict(counts)}`.\n')
          PY
      - name: Verify clean checkout
        run: |
          set -euo pipefail
          git diff --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: openai
      - name: Publish public feed
        id: deployment
        uses: actions/deploy-pages@v4
