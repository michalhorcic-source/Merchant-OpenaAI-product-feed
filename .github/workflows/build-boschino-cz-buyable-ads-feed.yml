name: Publish buyable Boschino CZ OpenAI Ads feed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-boschino-cz-buyable-ads-feed.yml'
      - 'scripts/build_boschino_cz_buyable_ads_feed.py'
      - 'tests/test_boschino_cz_buyable_ads_feed.py'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OAuth dependencies
        run: python -m pip install --disable-pip-version-check --no-input 'google-auth[requests]==2.38.0'
      - name: Validate builders
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
      - name: Read current Merchant offers and build validated CSV
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python scripts/build_boschino_cz_buyable_ads_feed.py \
            --output "$RUNNER_TEMP/boschino-cz-buyable-ads.csv" \
            --report "$RUNNER_TEMP/boschino-cz-buyable-ads-report.json"
          cp "$RUNNER_TEMP/boschino-cz-buyable-ads.csv" openai/boschino-cz-buyable-ads.csv
          git diff --check
      - name: Summarize safe feed counts
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/boschino-cz-buyable-ads-report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          summary = {
              'source_products': report.get('source_products'),
              'included': report.get('included'),
              'excluded_by_availability': report.get('excluded_by_availability', {}),
              'excluded_invalid_rows': report.get('excluded_invalid_rows'),
              'invalid_row_reasons': report.get('invalid_row_reasons', {}),
          }
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('### Buyable CZ feed counts\n\n```json\n')
              output.write(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
              output.write('\n```\n')
          PY
      - name: Report safe feed validation diagnostics
        if: failure()
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/boschino-cz-buyable-ads-report.json"
          if [ -s "$report" ]; then
            python - "$report" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          message = json.dumps(report, ensure_ascii=False, sort_keys=True).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Buyable CZ feed validation::{message}')
          print('### Buyable CZ feed validation failed')
          print()
          print('```json')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          print('```')
          PY
          fi
      - name: Save validated feed
        run: |
          set -euo pipefail
          git add -- openai/boschino-cz-buyable-ads.csv
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publish buyable Boschino CZ Ads feed with five labels [skip ci]'
            git push origin HEAD:main
          fi
      - name: Retain validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boschino-cz-buyable-ads-validation
          path: ${{ runner.temp }}/boschino-cz-buyable-ads-report.json
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: openai
      - name: Publish public feed
        id: deployment
        uses: actions/deploy-pages@v4
